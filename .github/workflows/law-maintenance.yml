name: Track learned patterns
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  issues: write
concurrency:
  group: factory-pattern-cleanup
jobs:
  track:
    runs-on: [self-hosted, factory]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Keep one cleanup card for remaining cases
        if: github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          remaining=$(jq -r '[.rules[] | select(.count > 0) | (.id + " (" + (.count|tostring) + ")")] | join(", ")' .github/factory-baseline.json)
          existing=$(gh issue list --repo "$GITHUB_REPOSITORY" --state open --label factory:pattern-cleanup --json number --jq '.[0].number // empty')
          if test -n "$remaining" && test -z "$existing"; then
            gh issue create --repo "$GITHUB_REPOSITORY" --title "Remove remaining learned patterns" --label factory:pattern-cleanup --label type:harness --label ready-for-dev --body "$(printf 'Fix the remaining patterns: %s\n\n- [ ] A1. Counts reach zero and the ratchet still runs.\n' "$remaining")"
          elif test -z "$remaining" && test -n "$existing"; then
            gh issue close "$existing" --repo "$GITHUB_REPOSITORY" --comment "The default branch permits zero outstanding cases."
          fi
